<DIV id="dfire-music-controls" style="text-align:center; margin:18px 0;">
  <AUDIO id="dfire-audio" preload="auto" loop>
    <SOURCE src="assets/midis/america.mp3" type="audio/mpeg">
  </AUDIO>

  <BUTTON id="dfire-play-music" type="button"
    style="font-family:'Comic Sans MS',Arial,sans-serif; font-size:16px; padding:8px 14px; cursor:pointer;">
    ♫ Play Music ♫
  </BUTTON>

  <BUTTON id="dfire-stop-music" type="button"
    style="font-family:'Comic Sans MS',Arial,sans-serif; font-size:16px; padding:8px 14px; cursor:pointer; margin-left:6px;">
    Stop
  </BUTTON>
</DIV>

<SCRIPT>
(function () {
  var audio = document.getElementById("dfire-audio");
  var play = document.getElementById("dfire-play-music");
  var stop = document.getElementById("dfire-stop-music");
  var interactionAttempted = false;

  function tryPlay() {
    var attempt = audio.play();
    if (attempt && typeof attempt.catch === "function") {
      attempt.catch(function () {
        // Modern browsers may block audible autoplay until visitor interaction.
      });
    }
  }

  function firstInteraction() {
    if (interactionAttempted) return;
    interactionAttempted = true;
    tryPlay();

    document.removeEventListener("click", firstInteraction);
    document.removeEventListener("touchstart", firstInteraction);
    document.removeEventListener("keydown", firstInteraction);
  }

  play.addEventListener("click", function (event) {
    event.stopPropagation();
    interactionAttempted = true;
    audio.play();
  });

  stop.addEventListener("click", function (event) {
    event.stopPropagation();
    interactionAttempted = true;
    audio.pause();
    audio.currentTime = 0;
  });

  window.addEventListener("load", tryPlay);

  document.addEventListener("click", firstInteraction);
  document.addEventListener("touchstart", firstInteraction, { passive: true });
  document.addEventListener("keydown", firstInteraction);
})();
</SCRIPT>
